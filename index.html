<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAFAF8;
    --card: #FFFFFF;
    --ink: #21221F;
    --ink-soft: #757468;
    --accent: #2F2E2B;
    --border: rgba(33,34,31,0.10);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#17181A; --card:#1F2022; --ink:#F3F2EE; --ink-soft:#9A9A92; --accent:#F3F2EE; --border:rgba(255,255,255,0.10); }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Inter", "Zen Maru Gothic", sans-serif;
    min-height: 100%; display: flex; align-items: center; justify-content: center;
  }
  .card {
    width: 100%; max-width: 380px; margin: 40px 20px; padding: 40px 28px;
    text-align: center;
  }
  .avatar {
    width: 86px; height: 86px; margin: 0 auto 18px; border-radius: 50%;
    background: var(--card); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
  }
  .avatar svg { width: 40px; height: 40px; }
  h1 {
    font-family: "Zen Maru Gothic", sans-serif; font-weight: 700; font-size: 1.5rem;
    margin: 0 0 6px;
  }
  p.bio { font-size: .92rem; color: var(--ink-soft); margin: 0 0 34px; line-height: 1.7; }

  .links { display: grid; gap: 12px; }
  .link {
    display: flex; align-items: center; gap: 12px;
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 15px 18px; text-decoration: none; color: var(--ink);
    transition: transform .12s ease, border-color .12s ease;
    text-align: left;
  }
  .link:active { transform: scale(0.98); }
  .link .ico { width: 20px; height: 20px; flex-shrink: 0; color: var(--ink-soft); }
  .link .txt { flex: 1; }
  .link .txt .t { font-weight: 600; font-size: .92rem; }
  .link .txt .s { font-size: .74rem; color: var(--ink-soft); margin-top: 1px; }
  .link .arrow { color: var(--ink-soft); font-size: .9rem; }

  .music-box {
    margin-top: 28px; text-align: left;
    background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px;
  }
  .music-label { font-size: .72rem; color: var(--ink-soft); margin-bottom: 2px; }
  .music-title { font-size: .92rem; font-weight: 600; margin-bottom: 12px; }
  .video-frame { position: relative; width: 100%; padding-top: 56.25%; border-radius: 10px; overflow: hidden; background: #000; }
  .video-frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

  footer { margin-top: 36px; font-size: .72rem; color: var(--ink-soft); opacity: .7; }
</style>
